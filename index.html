<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash of
      // the wrong theme. Kept inline & tiny so it runs synchronously in <head>.
      (function () {
        try {
          var saved = localStorage.getItem('radio_browser_theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Top Bar -->
      <header id="topbar">
        <div class="topbar-left">
          <span class="logo">&#9678; Radio</span>
          <span id="station-count" class="station-count">Loading…</span>
        </div>
        <div class="topbar-right">
          <button id="search-btn" class="icon-btn" title="Search (⌘K)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span>Search</span>
            <kbd>⌘K</kbd>
          </button>
          <button id="random-btn" class="icon-btn" title="Play a random station (R)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            <span>Random</span>
          </button>
          <button id="nearme-btn" class="icon-btn" title="Find stations near me">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Near Me</span>
          </button>
          <button id="favorites-toggle" class="icon-btn" title="Show favorites">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>Favorites</span>
          </button>
          <button id="theme-toggle" class="icon-btn icon-only" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <!-- Main layout -->
      <main id="main">
        <!-- Left panel: filters + station list -->
        <aside id="sidebar">
          <!-- Filters -->
          <div id="filters">
            <div class="filter-group">
              <label class="filter-label">Country</label>
              <div class="filter-select-wrap">
                <select id="filter-country">
                  <option value="">All countries</option>
                </select>
              </div>
            </div>
            <div class="filter-group">
              <label class="filter-label">Genre</label>
              <div class="filter-select-wrap">
                <select id="filter-genre">
                  <option value="">All genres</option>
                </select>
              </div>
            </div>
            <div class="filter-group">
              <label class="filter-label">Codec</label>
              <div class="filter-select-wrap">
                <select id="filter-codec">
                  <option value="">All codecs</option>
                </select>
              </div>
            </div>
            <button id="clear-filters" class="clear-btn" style="display:none">Clear filters</button>
          </div>

          <!-- Station list -->
          <div id="station-list-wrap">
            <div id="station-list"></div>
            <div id="list-empty" class="empty-msg" style="display:none">No stations match your filters.</div>
          </div>
        </aside>

        <!-- Right panel: globe -->
        <section id="globe-wrap">
          <div id="globe-container"></div>
        </section>
      </main>

      <!-- Bottom playback bar -->
      <footer id="player" class="player hidden">
        <div class="player-info">
          <div class="player-favicon">
            <img id="player-img" src="" alt="" />
          </div>
          <div class="player-meta">
            <span id="player-name" class="player-name">—</span>
            <span id="player-country" class="player-country">—</span>
          </div>
        </div>
        <div class="player-controls">
          <button id="play-pause-btn" class="play-btn" title="Play/Pause">
            <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
            <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <div class="player-vol">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" />
          </div>
        </div>
        <div class="player-right">
          <button id="sleep-timer-btn" class="icon-btn small" title="Sleep timer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span id="sleep-label">Sleep</span>
          </button>
          <button id="share-btn" class="icon-btn small" title="Share this station">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
          <button id="fav-btn" class="icon-btn small" title="Add to favorites">
            <svg id="fav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <button id="close-player-btn" class="icon-btn small" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <audio id="audio-el"></audio>
      </footer>
    </div>

    <!-- Search modal -->
    <div id="search-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Search stations">
      <div class="modal-box">
        <div class="modal-search-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="search-input" type="text" placeholder="Search stations, genres, countries…" autocomplete="off" />
          <kbd class="esc-key">ESC</kbd>
        </div>
        <div id="search-results"></div>
      </div>
    </div>

    <!-- Sleep timer modal -->
    <div id="sleep-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Sleep timer">
      <div class="modal-box sleep-box">
        <h3>Sleep Timer</h3>
        <div class="sleep-options">
          <button class="sleep-opt" data-mins="15">15 min</button>
          <button class="sleep-opt" data-mins="30">30 min</button>
          <button class="sleep-opt" data-mins="45">45 min</button>
          <button class="sleep-opt" data-mins="60">60 min</button>
          <button class="sleep-opt" data-mins="90">90 min</button>
        </div>
        <button id="cancel-sleep" class="clear-btn">Cancel timer</button>
      </div>
    </div>

    <!-- Autoplay prompt (shown when a deep-link can't autoplay without a gesture) -->
    <div id="autoplay-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Play station">
      <div class="modal-box autoplay-box">
        <h3>Play this station?</h3>
        <p id="autoplay-station-name" class="autoplay-name">—</p>
        <div class="autoplay-actions">
          <button id="autoplay-dismiss" class="clear-btn">Dismiss</button>
          <button id="autoplay-play" class="autoplay-play-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
            Play
          </button>
        </div>
      </div>
    </div>

    <!-- Globe cluster picker (co-located stations) -->
    <div id="globe-popover" class="globe-popover hidden" role="dialog" aria-label="Stations at this location"></div>

    <!-- Transient toast (e.g. "Link copied") -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
