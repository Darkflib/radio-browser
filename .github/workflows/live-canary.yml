name: Live canary (advisory)

# Advisory only — this workflow hits the real radio-browser mirrors and is NOT a
# merge gate. It runs on a schedule and on demand so upstream outages surface
# without ever blocking a pull request.
on:
  schedule:
    - cron: '17 6 * * *' # daily, ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Live radio-browser canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live canary
        run: npm run test:live
